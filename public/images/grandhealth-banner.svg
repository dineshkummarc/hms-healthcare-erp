<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A" />
      <stop offset="50%" stop-color="#0F2D59" />
      <stop offset="100%" stop-color="#041226" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <circle cx="1100" cy="80" r="280" fill="#06B6D4" opacity="0.08" filter="url(#glow)" />
  <circle cx="150" cy="360" r="240" fill="#3B82F6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Logo Mark -->
  <rect x="70" y="55" width="56" height="56" rx="14" fill="url(#cyanGrad)" />
  <path d="M98 70 V96 M85 83 H111" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Title Badge -->
  <rect x="140" y="65" width="220" height="34" rx="17" fill="#0E3758" stroke="#0891B2" stroke-width="1.5" />
  <text x="155" y="87" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE HEALTHCARE ERP</text>

  <!-- Main Headline -->
  <text x="70" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
    GrandHealth <tspan fill="url(#cyanGrad)">ERP</tspan>
  </text>
  <text x="70" y="205" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    Complete Multi-Tenant, Multi-Branch, Modular Healthcare Operating System for Modern Hospitals &amp; Clinics
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(70, 240)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="240" height="95" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="38" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">38 Modules</text>
    <text x="20" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Turnkey Healthcare Ecosystem</text>
    <text x="20" y="80" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Dynamic Activation Engine</text>

    <!-- Metric 2 -->
    <rect x="260" y="0" width="240" height="95" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <text x="280" y="38" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">82% Faster</text>
    <text x="280" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Patient Triage &amp; OPD Velocity</text>
    <text x="280" y="80" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Zero Double-Booking Guarantee</text>

    <!-- Metric 3 -->
    <rect x="520" y="0" width="240" height="95" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <text x="540" y="38" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">$120k+ / Yr</text>
    <text x="540" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Average Hospital Operating Savings</text>
    <text x="540" y="80" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Reconciled Cashier &amp; General Ledger</text>

    <!-- Metric 4 -->
    <rect x="780" y="0" width="280" height="95" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <text x="800" y="38" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Multi-Tenant</text>
    <text x="800" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Unlimited Hospitals, Branches &amp; Clinics</text>
    <text x="800" y="80" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Filament 5 · Laravel 12 · Tailwind</text>
  </g>

  <!-- Bottom Tech Stack Tag -->
  <text x="70" y="380" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Architected by <tspan fill="#38BDF8" font-weight="700">Imran Ahmed</tspan> (<tspan fill="#E2E8F0">me@imrandev.bd</tspan>) · <tspan fill="#22D3EE">https://imrandev.bd</tspan>
  </text>
</svg>
