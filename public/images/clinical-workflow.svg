<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#wfBg)" rx="16" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="45" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">END-TO-END PATIENT LIFECYCLE &amp; ENCOUNTER JOURNEY</text>
  <text x="50" y="75" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">
    Zero-Friction Clinical Workflow: From Check-In to General Ledger
  </text>

  <!-- 5 Step Cards connected by arrows -->
  <g transform="translate(50, 110)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="190" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="35" cy="35" r="16" fill="#E0F2FE" />
    <text x="30" y="40" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">1</text>
    <text x="60" y="40" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Registration &amp; Slot</text>
    <text x="20" y="75" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" line-height="1.4">
      • Auto MRN Generated<br/>
      • Self or Reception Booking<br/>
      • Atomic Slot Lock<br/>
      • Token Number Assigned
    </text>

    <!-- Arrow 1 -->
    <path d="M205 90 L225 90 M218 83 L225 90 L218 97" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Step 2 -->
    <rect x="235" y="0" width="190" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="270" cy="35" r="16" fill="#FEF3C7" />
    <text x="265" y="40" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">2</text>
    <text x="295" y="40" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Triage &amp; Vitals</text>
    <text x="255" y="75" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Reception Check-In<br/>
      • Priority Score Assigned<br/>
      • BP, Pulse, SpO2, BMI<br/>
      • Allergy Banner Highlight
    </text>

    <!-- Arrow 2 -->
    <path d="M440 90 L460 90 M453 83 L460 90 L453 97" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Step 3 -->
    <rect x="470" y="0" width="190" height="180" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="505" cy="35" r="16" fill="#E0F2FE" />
    <text x="500" y="40" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">3</text>
    <text x="530" y="40" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Clinician Consult</text>
    <text x="490" y="75" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • OPD Queue in /doctor<br/>
      • Longitudinal EMR History<br/>
      • SOAP Clinical Notes<br/>
      • Signed E-Prescription
    </text>

    <!-- Arrow 3 -->
    <path d="M675 90 L695 90 M688 83 L695 90 L688 97" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Step 4 -->
    <rect x="705" y="0" width="190" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="740" cy="35" r="16" fill="#DCFCE7" />
    <text x="735" y="40" fill="#16A34A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">4</text>
    <text x="765" y="40" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Fulfillment &amp; Labs</text>
    <text x="725" y="75" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Barcode Sample Order<br/>
      • LIS Technician Entry<br/>
      • Pharmacy FEFO Dispensing<br/>
      • Unicode PDF Prescription
    </text>

    <!-- Arrow 4 -->
    <path d="M910 90 L930 90 M923 83 L930 90 L923 97" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Step 5 -->
    <rect x="940" y="0" width="160" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="975" cy="35" r="16" fill="#F3E8FF" />
    <text x="970" y="40" fill="#9333EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">5</text>
    <text x="1000" y="40" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Settlement</text>
    <text x="955" y="75" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Unified Patient Bill<br/>
      • Partial/Split Payments<br/>
      • Balanced Journal Entry<br/>
      • Patient Portal Receipt
    </text>
  </g>
</svg>
