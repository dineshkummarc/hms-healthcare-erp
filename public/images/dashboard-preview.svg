      <text x="115" y="20" fill="#0F172A" font-weight="600">James Wilson (MRN-100001)</text>
      <text x="260" y="20" fill="#334155">Dr. Robert Chen</text>
      <text x="440" y="20" fill="#64748B">Cardiology</text>
      <text x="590" y="20" fill="#334155">09:00 AM</text>
      <rect x="725" y="4" width="70" height="22" rx="11" fill="#DCFCE7" />
