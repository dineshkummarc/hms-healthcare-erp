    <text x="40" y="410" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
      &#10003; Automated Clinician Workflow &amp; Concurrency Engine Active
    </text>
    <text x="40" y="430" fill="#15803D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      All appointments, bed admissions, and inventory lot deductions execute in atomic database transactions. EMR records are digitally signed and immutable.
    </text>
