<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background App Shell -->
  <rect width="1200" height="700" fill="#F1F5F9" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="700" fill="#0F172A" />
  
  <!-- Sidebar Brand -->
  <rect x="20" y="20" width="36" height="36" rx="8" fill="#06B6D4" />
  <path d="M38 28 V48 M28 38 H48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="68" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">GrandHealth</text>
  <text x="168" y="44" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">ERP</text>

  <!-- Sidebar Nav Groups -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    <!-- Active Nav -->
    <rect x="12" y="80" width="216" height="38" rx="8" fill="#1E293B" stroke="#0891B2" stroke-width="1" />
    <circle cx="32" cy="99" r="6" fill="#06B6D4" />
    <text x="48" y="103" fill="#FFFFFF" font-weight="700">Hospital Dashboard</text>

    <!-- Group 1 -->
    <text x="24" y="145" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">PATIENT CARE &amp; CLINICAL</text>
    <text x="48" y="175" fill="#94A3B8">Patients &amp; MRN Registry</text>
    <text x="48" y="205" fill="#94A3B8">Doctor Appointments</text>
    <text x="48" y="235" fill="#94A3B8">OPD Consultation Queue</text>
    <text x="48" y="265" fill="#94A3B8">EMR &amp; Medical Records</text>
    <text x="48" y="295" fill="#94A3B8">Electronic Prescriptions</text>
    <text x="48" y="325" fill="#94A3B8">Inpatient Admissions (IPD)</text>

    <!-- Group 2 -->
    <text x="24" y="375" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">DIAGNOSTICS &amp; PHARMACY</text>
    <text x="48" y="405" fill="#94A3B8">Laboratory Information (LIS)</text>
    <text x="48" y="435" fill="#94A3B8">Radiology &amp; Imaging (RIS)</text>
    <text x="48" y="465" fill="#94A3B8">Pharmacy &amp; Batch Stock</text>

    <!-- Group 3 -->
    <text x="24" y="515" fill="#64748B" font-size="10" font-weight="700" letter-spacing="1">FINANCIALS &amp; AUDIT</text>
    <text x="48" y="545" fill="#94A3B8">Billing &amp; Invoices</text>
    <text x="48" y="575" fill="#94A3B8">Double-Entry Journals</text>
    <text x="48" y="605" fill="#94A3B8">Module Control Center</text>
    <text x="48" y="635" fill="#94A3B8">HIPAA Audit Trail</text>
  </g>

  <!-- Topbar -->
  <rect x="240" y="0" width="960" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="270" y="38" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
    Grand City General Hospital · <tspan fill="#64748B" font-size="14" font-weight="500">Central Hospital Campus</tspan>
  </text>
  
  <rect x="920" y="16" width="130" height="32" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
  <circle cx="936" cy="32" r="5" fill="#0D9488" />
  <text x="948" y="37" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">38 Modules Active</text>

  <rect x="1065" y="16" width="115" height="32" rx="8" fill="#0284C7" />
  <text x="1080" y="37" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+ New Patient</text>

  <!-- Main Content Canvas -->
  <!-- Stats Row (6 Cards) -->
  <g transform="translate(265, 85)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="140" height="85" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="14" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Today's Appointments</text>
    <text x="14" y="52" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">128</text>
    <text x="14" y="70" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">18 waiting in queue</text>

    <!-- Stat 2 -->
    <rect x="155" y="0" width="140" height="85" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="169" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Doctors on Duty</text>
    <text x="169" y="52" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">22</text>
    <text x="169" y="70" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">20 Specialties</text>

    <!-- Stat 3 -->
    <rect x="310" y="0" width="140" height="85" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="324" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Admitted Inpatients</text>
    <text x="324" y="52" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">42</text>
    <text x="324" y="70" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">8 beds available</text>

    <!-- Stat 4 -->
    <rect x="465" y="0" width="140" height="85" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="479" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pending Lab Tests</text>
    <text x="479" y="52" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">14</text>
    <text x="479" y="70" fill="#DC2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">2 Critical flags</text>

    <!-- Stat 5 -->
    <rect x="620" y="0" width="140" height="85" rx="12" fill="#FFFFFF" filter="url(#cardShadow)" />
    <text x="634" y="24" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Today's Collections</text>
    <text x="634" y="52" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">$14,250</text>
    <text x="634" y="70" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Cashier reconciled</text>

