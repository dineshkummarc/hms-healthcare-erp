      <text x="115" y="20" fill="#0F172A" font-weight="600">Emma Watson (MRN-100002)</text>
      <text x="260" y="20" fill="#334155">Dr. Sarah Adams</text>
      <text x="440" y="20" fill="#64748B">Pediatrics</text>
      <text x="590" y="20" fill="#334155">09:15 AM</text>
      <rect x="725" y="4" width="70" height="22" rx="11" fill="#DCFCE7" />
      <text x="740" y="19" fill="#15803D" font-size="10" font-weight="700">Completed</text>
      <rect x="815" y="4" width="55" height="22" rx="11" fill="#DCFCE7" />
      <text x="830" y="19" fill="#15803D" font-size="10" font-weight="700">PAID</text>
    </g>
    <line x1="20" y1="202" x2="895" y2="202" stroke="#F1F5F9" />

    <!-- Row 3 -->
    <g transform="translate(20, 212)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <text x="15" y="20" fill="#0284C7" font-weight="700">APT-300003</text>
      <text x="115" y="20" fill="#0F172A" font-weight="600">Michael Chang (MRN-100003)</text>
      <text x="260" y="20" fill="#334155">Dr. David Miller</text>
      <text x="440" y="20" fill="#64748B">Orthopedics</text>
      <text x="590" y="20" fill="#334155">09:30 AM</text>
      <rect x="725" y="4" width="75" height="22" rx="11" fill="#E0F2FE" />
      <text x="732" y="19" fill="#0369A1" font-size="10" font-weight="700">In Consult</text>
      <rect x="815" y="4" width="55" height="22" rx="11" fill="#DCFCE7" />
      <text x="830" y="19" fill="#15803D" font-size="10" font-weight="700">PAID</text>
    </g>
    <line x1="20" y1="248" x2="895" y2="248" stroke="#F1F5F9" />

    <!-- Row 4 -->
    <g transform="translate(20, 258)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <text x="15" y="20" fill="#0284C7" font-weight="700">APT-300004</text>
      <text x="115" y="20" fill="#0F172A" font-weight="600">Sophia Martinez (MRN-100004)</text>
      <text x="260" y="20" fill="#334155">Dr. Lisa Ray</text>
      <text x="440" y="20" fill="#64748B">General Medicine</text>
      <text x="590" y="20" fill="#334155">09:45 AM</text>
      <rect x="725" y="4" width="75" height="22" rx="11" fill="#FEF3C7" />
      <text x="734" y="19" fill="#92400E" font-size="10" font-weight="700">Checked In</text>
      <rect x="815" y="4" width="55" height="22" rx="11" fill="#FEE2E2" />
      <text x="825" y="19" fill="#B91C1C" font-size="10" font-weight="700">UNPAID</text>
    </g>
    <line x1="20" y1="294" x2="895" y2="294" stroke="#F1F5F9" />

    <!-- Row 5 -->
    <g transform="translate(20, 304)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <text x="15" y="20" fill="#0284C7" font-weight="700">APT-300005</text>
      <text x="115" y="20" fill="#0F172A" font-weight="600">Alexander Bell (MRN-100005)</text>
      <text x="260" y="20" fill="#334155">Dr. Marcus Vance</text>
      <text x="440" y="20" fill="#64748B">Cardiology</text>
      <text x="590" y="20" fill="#334155">10:00 AM</text>
      <rect x="725" y="4" width="75" height="22" rx="11" fill="#F1F5F9" />
      <text x="735" y="19" fill="#475569" font-size="10" font-weight="700">Scheduled</text>
      <rect x="815" y="4" width="55" height="22" rx="11" fill="#FEE2E2" />
      <text x="825" y="19" fill="#B91C1C" font-size="10" font-weight="700">UNPAID</text>
